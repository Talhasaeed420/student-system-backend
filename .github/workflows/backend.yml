name: "FOR AWS"
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  talha:
    runs-on: ubuntu-latest
    steps:
      - name: check code
        uses: actions/checkout@v4
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{secrets.USERNAME}}
          password: ${{secrets.DOCKERPASS}}
      - name: build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{secrets.USERNAME}}/backend:${{github.sha}}
            ${{secrets.USERNAME}}/backend:latest


  